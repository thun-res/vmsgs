syntax = "proto3";

package vmsgs.proto.map;

import "common/header.proto";
import "geometry/point.proto";

// Plain-text Lanelet primitives mirroring lanelet2 schema (for slim lookups).
// For the full binary map use map/fbs/lanelet_map.fbs.

enum LineMarkingType {
  LINE_MARKING_UNKNOWN = 0;
  LINE_MARKING_SOLID = 1;
  LINE_MARKING_DASHED = 2;
  LINE_MARKING_DOUBLE_SOLID = 3;
  LINE_MARKING_DOUBLE_DASHED = 4;
  LINE_MARKING_VIRTUAL = 5;
  LINE_MARKING_CURB = 6;
  LINE_MARKING_GUARD_RAIL = 7;
}

// Ordered polyline carrying a stable map identifier and semantic marking type.
message LineString {
  // Stable identifier of this line string.
  uint64 id = 1;
  // Type encoded using the referenced `LineMarkingType` contract.
  LineMarkingType type = 2;
  // Implementation-independent semantic subtype string defined by the map format.
  string subtype = 3;
  // Ordered samples expressed in the coordinate frame identified by the enclosing header.
  repeated vmsgs.proto.geometry.Point points = 4;
}

// Drivable lane corridor bounded by left and right map-frame polylines.
message Lanelet {
  // Stable identifier of this lanelet.
  uint64 id = 1;
  // Left bound encoded using the referenced `LineString` contract.
  LineString left_bound = 2;
  // Right bound encoded using the referenced `LineString` contract.
  LineString right_bound = 3;
  string subtype = 4;   // "road", "crosswalk", "bicycle_lane", ...
  string location = 5;  // "urban", "highway", ...
  // True when the lanelet permits travel in one direction only.
  bool one_way = 6;
  float speed_limit = 7;  // m/s
  // Centerline is optional - clients can recompute.
  repeated vmsgs.proto.geometry.Point centerline = 8;
}

// Map-frame polygon delimiting a pedestrian crossing area.
message Crosswalk {
  // Stable identifier of this crosswalk.
  uint64 id = 1;
  // Polygon in map frame.
  repeated vmsgs.proto.geometry.Point points = 2;
}

// Map-frame segment at which traffic is required to stop.
message StopLine {
  // Stable identifier of this stop line.
  uint64 id = 1;
  // Start encoded using the referenced `vmsgs.proto.geometry.Point` contract.
  vmsgs.proto.geometry.Point start = 2;
  // End encoded using the referenced `vmsgs.proto.geometry.Point` contract.
  vmsgs.proto.geometry.Point end = 3;
}

// Semantic traffic sign and its map-frame position and yaw orientation.
message TrafficSign {
  // Stable identifier of this traffic sign.
  uint64 id = 1;
  // Sign category, e.g. "stop", "yield", "speed_limit_50".
  string category = 2;
  // Position encoded using the referenced `vmsgs.proto.geometry.Point` contract.
  vmsgs.proto.geometry.Point position = 3;
  // Angular value in radians unless the enclosing type documents a different unit.
  float orientation_yaw = 4;
}

// Compact collection of commonly queried high-definition map primitives.
message HDMapPrimitives {
  // Timestamp, sequence number, and coordinate frame shared by this payload.
  vmsgs.proto.common.Header header = 1;
  // Lanelets included in this map-primitive collection.
  repeated Lanelet lanelets = 2;
  // Crosswalks included in this map-primitive collection.
  repeated Crosswalk crosswalks = 3;
  // Stop lines included in this map-primitive collection.
  repeated StopLine stop_lines = 4;
  // Traffic signs included in this map-primitive collection.
  repeated TrafficSign traffic_signs = 5;
}
