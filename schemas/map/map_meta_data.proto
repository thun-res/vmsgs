syntax = "proto3";

package vmsgs.proto.map;

import "geometry/pose.proto";

// Static metadata about a 2D occupancy map / lanelet map.
message MapMetaData {
  uint64 time_map_load = 1;  // nanoseconds
  float resolution = 2;      // m/cell
  // Number of grid cells along the map x axis.
  uint32 width = 3;
  // Number of grid cells along the map y axis.
  uint32 height = 4;
  // Origin encoded using the referenced `vmsgs.proto.geometry.Pose` contract.
  vmsgs.proto.geometry.Pose origin = 5;
  // Stable identifier of this map.
  string map_id = 6;
  // Version identifier of this map.
  string version = 7;
  string format = 8;  // "lanelet2", "opendrive", "vector_tile", ...
}
