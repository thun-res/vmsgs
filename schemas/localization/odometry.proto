syntax = "proto3";

package vmsgs.proto.localization;

import "common/header.proto";
import "geometry/pose.proto";
import "geometry/twist.proto";

// Pose+twist with covariance, expressed in `header.frame_id` (parent) for pose
// and in `child_frame_id` for twist.
message Odometry {
  // Timestamp, sequence number, and coordinate frame shared by this payload.
  vmsgs.proto.common.Header header = 1;
  // Child coordinate frame in which the body motion is expressed.
  string child_frame_id = 2;
  // Pose expressed in the coordinate frame identified by the enclosing header.
  vmsgs.proto.geometry.PoseWithCovariance pose = 3;
  // Body linear and angular velocity in child_frame_id with row-major 6x6 covariance.
  vmsgs.proto.geometry.TwistWithCovariance twist = 4;
}
