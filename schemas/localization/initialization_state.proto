syntax = "proto3";

package vmsgs.proto.localization;

import "common/header.proto";

// Progress signal for a localizer's initial-pose convergence.
message LocalizationInitializationState {
  // Coarse lifecycle states of localizer initialization and convergence.
  enum State {
    UNKNOWN = 0;
    UNINITIALIZED = 1;
    INITIALIZING = 2;
    INITIALIZED = 3;
  }
  // Timestamp, sequence number, and coordinate frame shared by this payload.
  vmsgs.proto.common.Header header = 1;
  // Current localizer initialization lifecycle state.
  State state = 2;
}
