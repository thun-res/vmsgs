syntax = "proto3";

package vmsgs.proto.embodied;

import "common/header.proto";
import "common/uuid.proto";
import "common/key_value.proto";

// Portable lifecycle state of a reusable robot skill invocation.
enum SkillState {
  SKILL_UNKNOWN = 0;
  SKILL_PENDING = 1;
  SKILL_RUNNING = 2;
  SKILL_SUCCEEDED = 3;
  SKILL_FAILED = 4;
  SKILL_CANCELED = 5;
  SKILL_PAUSED = 6;
}

// Library-level skill (pick, place, open_door, ...).
message SkillDescriptor {
  // Name of this skill, matched by SkillRequest.skill_name and TaskStep.skill_name.
  string name = 1;
  // Version identifier of this skill descriptor.
  string version = 2;
  // Human-readable description of the current state or mission.
  string description = 3;
  // JSON-Schema or proto-message FQN describing the parameters.
  string parameters_schema = 4;
}

// Invocation of a named skill with a unique execution identifier.
message SkillRequest {
  // Timestamp, sequence number, and coordinate frame shared by this payload.
  vmsgs.proto.common.Header header = 1;
  // Client-generated 128-bit identifier shared by feedback, result, and cancellation.
  vmsgs.proto.common.UUID skill_uuid = 2;
  // Name of the skill to invoke, matching a SkillDescriptor.name.
  string skill_name = 3;
  // Free-form parameters.
  repeated vmsgs.proto.common.KeyValue parameters = 4;
  // Optional natural-language hint.
  string instruction = 5;
}

// Periodic progress feedback for a running skill invocation.
message SkillFeedback {
  // Timestamp, sequence number, and coordinate frame shared by this payload.
  vmsgs.proto.common.Header header = 1;
  // Identifier of the active skill invocation producing this feedback.
  vmsgs.proto.common.UUID skill_uuid = 2;
  // Current invocation lifecycle state; terminal states are repeated in SkillResult.
  SkillState state = 3;
  float progress = 4;  // 0..1
  // Human-readable progress detail for this feedback update.
  string message = 5;
  // Low-volume named progress metrics; keys must be unique within this update.
  repeated vmsgs.proto.common.KeyValue metrics = 6;
}

// Terminal outcome and optional typed outputs of a skill invocation.
message SkillResult {
  // Timestamp, sequence number, and coordinate frame shared by this payload.
  vmsgs.proto.common.Header header = 1;
  // Identifier of the completed skill invocation.
  vmsgs.proto.common.UUID skill_uuid = 2;
  // Final lifecycle state; must be succeeded, failed, or canceled.
  SkillState terminal_state = 3;
  // Human-readable detail describing the terminal outcome.
  string message = 4;
  // Named result values defined by the selected skill descriptor's output contract.
  repeated vmsgs.proto.common.KeyValue outputs = 5;
}
