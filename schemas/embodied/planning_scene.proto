syntax = "proto3";
package vmsgs.proto.embodied;
import "common/header.proto";
import "geometry/pose.proto";
import "embodied/robot_state.proto";
import "shape/shape.proto";

// Reuses the canonical shape definitions rather than duplicating primitive
// dimension layouts inside the planning-scene domain.
message CollisionGeometry {
  // Exactly one geometric representation should be populated.
  oneof geometry {
    // Compact box, sphere, cylinder, cone, or prism representation.
    vmsgs.proto.shape.SolidPrimitive primitive = 1;

    // Explicit triangle mesh or a URI referencing its source asset.
    vmsgs.proto.shape.Mesh mesh = 2;
  }
}
// Named world object and the operation used to update the planning scene.
message CollisionObject {
  // Incremental scene update applied to this object identifier.
  enum Operation {
    ADD = 0;
    REMOVE = 1;
    APPEND = 2;
    MOVE = 3;
  }
  // Timestamp, sequence number, and coordinate frame shared by this payload.
  vmsgs.proto.common.Header header = 1;
  // Stable identifier for this collision object.
  string id = 2;
  // Scene mutation applied to the object identified by id.
  Operation operation = 3;
  // Collision geometries; length must equal shape_poses length.
  repeated CollisionGeometry shapes = 4;
  // Per-geometry poses in header.frame_id, aligned one-to-one with shapes.
  repeated vmsgs.proto.geometry.Pose shape_poses = 5;

  // Named object-local frames; names are unique and aligned with subframe_poses.
  repeated string subframe_names = 6;

  // Object-local subframe poses aligned one-to-one with subframe_names.
  repeated vmsgs.proto.geometry.Pose subframe_poses = 7;
}
// Collision object rigidly attached to a robot link during manipulation.
message AttachedCollisionObject {
  // Robot link the collision object is rigidly attached to.
  string link_name = 1;
  // Collision object whose pose becomes rigidly attached to link_name.
  CollisionObject object = 2;
  // Robot links permitted to contact this object without reporting collision.
  repeated string touch_links = 3;
}
// Symmetric exception permitting or prohibiting contact between two names.
message AllowedCollision {
  // Name of the first link or collision object in the pair.
  string first = 1;
  // Name of the second link or collision object in the pair.
  string second = 2;
  // True to permit contact between first and second without reporting a collision.
  bool allowed = 3;
}

// Binary three-dimensional occupancy map positioned in the planning frame.
message OctomapWithPose {
  // Map encoding, for example octomap-binary or octomap-full.
  string encoding = 1;

  // Leaf resolution in metres.
  double resolution = 2;

  // Pose of the occupancy-map origin in the planning-scene frame.
  vmsgs.proto.geometry.Pose origin = 3;

  // Complete encoded occupancy-map payload.
  bytes data = 4;
}

// Per-link collision padding applied by the planning environment.
message LinkPadding {
  // Robot link name.
  string link_name = 1;

  // Added collision padding in metres; must be non-negative.
  double padding = 2;
}

// Per-link multiplicative collision-geometry scale.
message LinkScale {
  // Robot link name.
  string link_name = 1;

  // Positive multiplicative scale; one leaves geometry unchanged.
  double scale = 2;
}
// Complete or differential collision-planning world and current robot state.
message PlanningScene {
  // Timestamp, sequence number, and coordinate frame shared by this payload.
  vmsgs.proto.common.Header header = 1;
  // Name of this planning scene.
  string name = 2;
  // Current robot state used for collision checking and attached-object poses.
  RobotState robot_state = 3;
  // Collision objects in the world; object IDs must be unique.
  repeated CollisionObject world = 4;
  // Objects rigidly attached to robot links during manipulation.
  repeated AttachedCollisionObject attached = 5;
  // Symmetric contact exceptions between named links or objects.
  repeated AllowedCollision allowed_collisions = 6;
  // True when this message is an incremental update over the current scene.
  bool is_diff = 7;

  // Optional three-dimensional occupancy map for collision checking.
  OctomapWithPose octomap = 8;

  // Collision paddings keyed by robot link name.
  repeated LinkPadding link_padding = 9;

  // Collision geometry scales keyed by robot link name.
  repeated LinkScale link_scale = 10;
}
