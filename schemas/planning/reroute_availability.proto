syntax = "proto3";

package vmsgs.proto.planning;

import "common/header.proto";

// Whether the mission planner is currently able to recompute a route.
message RerouteAvailability {
  // Timestamp, sequence number, and coordinate frame shared by this payload.
  vmsgs.proto.common.Header header = 1;
  // True when the mission planner can currently recompute a route.
  bool availability = 2;
  // Human-readable reason intended for diagnostics; not for machine control.
  string reason = 3;
}
