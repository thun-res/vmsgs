syntax = "proto3";

package vmsgs.proto.geometry;

import "geometry/point.proto";
import "common/header.proto";

// Closed polygon. The boundary is implicit between the last and first point.
message Polygon {
  // Ordered boundary vertices; the final vertex connects back to the first.
  repeated Point32 points = 1;
}

// Timestamped planar polygon whose vertices are expressed in header.frame_id.
message PolygonStamped {
  // Polygon timestamp in nanoseconds and vertex coordinate frame.
  vmsgs.proto.common.Header header = 1;
  // Ordered planar boundary vertices expressed in header.frame_id.
  Polygon polygon = 2;
}
