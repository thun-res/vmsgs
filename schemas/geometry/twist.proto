syntax = "proto3";

package vmsgs.proto.geometry;

import "geometry/vector3.proto";
import "common/header.proto";

// Linear and angular velocity.
message Twist {
  // Linear velocity along the containing frame axes, in metres per second.
  Vector3 linear = 1;
  // Angular velocity about the containing frame axes, in radians per second.
  Vector3 angular = 2;
}

// Timestamped linear and angular velocity in header.frame_id.
message TwistStamped {
  // Measurement timestamp in nanoseconds and velocity coordinate frame.
  vmsgs.proto.common.Header header = 1;
  // Linear and angular velocity expressed in header.frame_id.
  Twist twist = 2;
}

// Linear and angular velocity accompanied by row-major 6x6 uncertainty.
message TwistWithCovariance {
  // Measured or estimated linear and angular velocity.
  Twist twist = 1;
  // Length 36; row-major covariance over (vx, vy, vz, wx, wy, wz).
  repeated double covariance = 2 [packed = true];
}

// Timestamped velocity estimate with covariance and coordinate frame.
message TwistWithCovarianceStamped {
  // Estimate timestamp in nanoseconds and velocity coordinate frame.
  vmsgs.proto.common.Header header = 1;
  // Velocity estimate and row-major 6x6 uncertainty.
  TwistWithCovariance twist = 2;
}
