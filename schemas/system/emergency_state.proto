syntax = "proto3";

package vmsgs.proto.system;

import "common/header.proto";

// Lifecycle state of emergency handling and the minimum-risk maneuver.
enum EmergencyState {
  EMERGENCY_STATE_NORMAL = 0;
  EMERGENCY_STATE_OVERRIDE_REQUESTING = 1;
  EMERGENCY_STATE_MRM_OPERATING = 2;
  EMERGENCY_STATE_MRM_SUCCEEDED = 3;
  EMERGENCY_STATE_MRM_FAILED = 4;
}

// Timestamped emergency-state snapshot, valid until superseded.
message EmergencyStateStamped {
  // Time at which this emergency state was observed.
  vmsgs.proto.common.Header header = 1;

  // Current emergency-handling state.
  EmergencyState state = 2;
}
