syntax = "proto3";

package vmsgs.proto.vehicle;

import "common/header.proto";

// Static vehicle dimensions in meters.
// Distinct from VehicleKinematics which carries dynamic/kinematic limits.
message VehicleDimensions {
  // Wheel radius in metres.
  float wheel_radius = 1;
  // Wheel (tyre) width in metres.
  float wheel_width = 2;
  // Wheelbase: longitudinal distance between the front and rear axles, in metres.
  float wheel_base = 3;
  // Wheel tread: lateral distance between the left and right wheels, in metres.
  float wheel_tread = 4;
  // Front overhang from the front axle to the front bumper, in metres.
  float front_overhang = 5;
  // Rear overhang from the rear axle to the rear bumper, in metres.
  float rear_overhang = 6;
  // Left overhang: lateral distance from the left wheels to the left edge of the vehicle body, in metres.
  float left_overhang = 7;
  // Right overhang: lateral distance from the right wheels to the right edge of the vehicle body, in metres.
  float right_overhang = 8;
  // Vehicle height in metres.
  float height = 9;
  // Convex hull footprint of the vehicle in body frame (clockwise).
  // Length 2N, alternating x,y in m.
  repeated float footprint = 10 [packed = true];
}

// Capability / spec sheet.
message VehicleSpecs {
  // Vehicle manufacturer or platform vendor name.
  string vendor = 1;
  // Vehicle model or product-family name.
  string model = 2;
  // Version identifier of this vehicle specification.
  string version = 3;
  // Maximum allowed payload (kg).
  float max_payload_kg = 4;
  // Number of seats.
  uint32 num_seats = 5;
  // True if this is a passenger vehicle (false for cargo / shuttle / robot).
  bool passenger_vehicle = 6;
}

// Dynamic vehicle metrics.
message VehicleMetrics {
  // Timestamp, sequence number, and coordinate frame shared by this payload.
  vmsgs.proto.common.Header header = 1;
  float odometer_m = 2;         // total distance traveled (m)
  float energy_remaining = 3;   // [0,1] for both fuel and battery vehicles
  float estimated_range_m = 4;  // m
}
