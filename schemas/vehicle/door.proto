syntax = "proto3";

package vmsgs.proto.vehicle;

import "common/header.proto";

// Stable logical index for common passenger-vehicle openings.
enum DoorIndex {
  DOOR_INDEX_UNKNOWN = 0;
  DOOR_FRONT_LEFT = 1;
  DOOR_FRONT_RIGHT = 2;
  DOOR_REAR_LEFT = 3;
  DOOR_REAR_RIGHT = 4;
  DOOR_TRUNK = 5;
  DOOR_HOOD = 6;
}

// Observable physical state of an individual door or opening.
enum DoorState {
  DOOR_STATE_UNKNOWN = 0;
  DOOR_STATE_CLOSED = 1;
  DOOR_STATE_AJAR = 2;
  DOOR_STATE_OPEN = 3;
}

// Requests opening or closing one indexed door.
message DoorCommand {
  // Timestamp, sequence number, and coordinate frame shared by this payload.
  vmsgs.proto.common.Header header = 1;
  // Door encoded using the referenced `DoorIndex` contract.
  DoorIndex door = 2;
  // True = open, false = close.
  bool open = 3;
}

// Timestamped door states indexed by `DoorIndex` numeric value.
message DoorStatus {
  // Timestamp, sequence number, and coordinate frame shared by this payload.
  vmsgs.proto.common.Header header = 1;
  // index = enum DoorIndex
  repeated DoorState states = 2 [packed = true];
}
