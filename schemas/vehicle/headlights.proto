syntax = "proto3";

package vmsgs.proto.vehicle;

import "common/header.proto";

// Stable operating modes for the vehicle's forward exterior lamps.
enum HeadlightsCode {
  HEADLIGHTS_OFF = 0;
  HEADLIGHTS_PARKING = 1;
  HEADLIGHTS_LOW_BEAM = 2;
  HEADLIGHTS_HIGH_BEAM = 3;
  HEADLIGHTS_NO_COMMAND = 4;
}

// Requests a forward-lighting mode.
message HeadlightsCommand {
  // Timestamp, sequence number, and coordinate frame shared by this payload.
  vmsgs.proto.common.Header header = 1;
  // Command encoded using the referenced `HeadlightsCode` contract.
  HeadlightsCode command = 2;
}

// Reports the effective forward-lighting mode.
message HeadlightsReport {
  // Timestamp, sequence number, and coordinate frame shared by this payload.
  vmsgs.proto.common.Header header = 1;
  // Report encoded using the referenced `HeadlightsCode` contract.
  HeadlightsCode report = 2;
}
