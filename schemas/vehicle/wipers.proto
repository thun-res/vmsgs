syntax = "proto3";

package vmsgs.proto.vehicle;

import "common/header.proto";

// Stable operating modes for the windshield wiper system.
enum WipersCode {
  WIPERS_OFF = 0;
  WIPERS_LOW = 1;
  WIPERS_HIGH = 2;
  WIPERS_INTERMITTENT = 3;
  WIPERS_AUTO = 4;
  WIPERS_NO_COMMAND = 5;
}

// Requests a windshield-wiper operating mode.
message WipersCommand {
  // Timestamp, sequence number, and coordinate frame shared by this payload.
  vmsgs.proto.common.Header header = 1;
  // Command encoded using the referenced `WipersCode` contract.
  WipersCode command = 2;
}

// Reports the effective windshield-wiper operating mode.
message WipersReport {
  // Timestamp, sequence number, and coordinate frame shared by this payload.
  vmsgs.proto.common.Header header = 1;
  // Report encoded using the referenced `WipersCode` contract.
  WipersCode report = 2;
}
