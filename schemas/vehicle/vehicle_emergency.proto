syntax = "proto3";

package vmsgs.proto.vehicle;

import "common/header.proto";

// Vehicle-side emergency state.
message VehicleEmergencyStamped {
  // Timestamp, sequence number, and coordinate frame shared by this payload.
  vmsgs.proto.common.Header header = 1;
  // True when the vehicle is reporting an emergency state.
  bool emergency = 2;
  // Human-readable reason intended for diagnostics; not for machine control.
  string reason = 3;
}
