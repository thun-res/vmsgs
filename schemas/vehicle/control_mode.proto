syntax = "proto3";

package vmsgs.proto.vehicle;

import "common/header.proto";

// Degree of longitudinal and lateral authority granted to automation.
enum ControlMode {
  CONTROL_MODE_NO_COMMAND = 0;
  CONTROL_MODE_AUTONOMOUS = 1;
  CONTROL_MODE_AUTONOMOUS_STEER_ONLY = 2;
  CONTROL_MODE_AUTONOMOUS_VELOCITY_ONLY = 3;
  CONTROL_MODE_MANUAL = 4;
  CONTROL_MODE_DISENGAGED = 5;
  CONTROL_MODE_NOT_READY = 6;
}

// Requests a change in vehicle control authority.
message ControlModeCommand {
  // Timestamp, sequence number, and coordinate frame shared by this payload.
  vmsgs.proto.common.Header header = 1;
  // Mode encoded using the referenced `ControlMode` contract.
  ControlMode mode = 2;
}

// Reports the vehicle interface's currently effective control authority.
message ControlModeReport {
  // Timestamp, sequence number, and coordinate frame shared by this payload.
  vmsgs.proto.common.Header header = 1;
  // Mode encoded using the referenced `ControlMode` contract.
  ControlMode mode = 2;
}
