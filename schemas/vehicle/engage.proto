syntax = "proto3";

package vmsgs.proto.vehicle;

import "common/header.proto";

// Requests engagement or disengagement of autonomous vehicle control.
message Engage {
  // Timestamp, sequence number, and coordinate frame shared by this payload.
  vmsgs.proto.common.Header header = 1;
  // True to engage autonomous vehicle control; false to disengage.
  bool engage = 2;
}
