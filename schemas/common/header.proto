syntax = "proto3";

package vmsgs.proto.common;

// Standard message header carried by every stamped message.
//
// Carries a monotonic sequence, coordinate frame, source measurement time, and
// an optional publication time compatible with zero-copy transport headers.
message Header {
  // Monotonically increasing sequence number assigned by the publisher.
  uint64 seq = 1;

  // Coordinate frame this data is expressed in (e.g. "base_link", "map").
  string frame_id = 2;

  // Timestamp when the data was acquired at its source, in nanoseconds.
  // The clock domain is deployment-defined and must be consistent per stream.
  uint64 stamp = 3;

  // Timestamp when the message entered the transport, in nanoseconds.
  // Producers should set this equal to stamp when no separate value is known.
  uint64 publish_stamp = 4;
}
