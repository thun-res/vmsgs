syntax = "proto3";

package vmsgs.proto.perception;

import "common/header.proto";

// Illuminated color or semantic color state of a traffic-light element.
enum TrafficLightColor {
  TL_COLOR_UNKNOWN = 0;
  TL_COLOR_RED = 1;
  TL_COLOR_AMBER = 2;
  TL_COLOR_GREEN = 3;
  TL_COLOR_WHITE = 4;
}

// Physical lens or symbol shape of a traffic-light element.
enum TrafficLightShape {
  TL_SHAPE_UNKNOWN = 0;
  TL_SHAPE_CIRCLE = 1;
  TL_SHAPE_LEFT_ARROW = 2;
  TL_SHAPE_RIGHT_ARROW = 3;
  TL_SHAPE_UP_ARROW = 4;
  TL_SHAPE_DOWN_ARROW = 5;
  TL_SHAPE_DOWN_LEFT_ARROW = 6;
  TL_SHAPE_DOWN_RIGHT_ARROW = 7;
  TL_SHAPE_CROSS = 8;
}

// Illumination state of a traffic-light element.
enum TrafficLightStatus {
  TL_STATUS_UNKNOWN = 0;
  TL_STATUS_SOLID_OFF = 1;
  TL_STATUS_SOLID_ON = 2;
  TL_STATUS_FLASHING = 3;
}

// One independently illuminated traffic-light lens or symbol.
message TrafficLightElement {
  // Observed emitted color.
  TrafficLightColor color = 1;
  // Physical lamp or symbol shape.
  TrafficLightShape shape = 2;
  // Whether the indication is steady, flashing, or unknown.
  TrafficLightStatus status = 3;
  // Recognition confidence in the inclusive range [0, 1].
  float confidence = 4;
}

// Traffic-light elements that jointly govern one movement or lane group.
message TrafficLightGroup {
  // Map element id (lanelet regulatory element id).
  int64 traffic_light_group_id = 1;
  // Simultaneously observed indications belonging to this map group.
  repeated TrafficLightElement elements = 2;
}

// Traffic-light groups observed together in one perception cycle.
message TrafficLightGroupArray {
  // Observation timestamp in nanoseconds and camera or map frame.
  vmsgs.proto.common.Header header = 1;
  // Recognized groups; map IDs should be unique in this cycle.
  repeated TrafficLightGroup traffic_light_groups = 2;
}
