syntax = "proto3";

package vmsgs.proto.tf2;

// Error reported by transform (tf2) lookup operations.
message TF2Error {
  // Stable error categories that callers may use for retry or fallback logic.
  enum Code {
    NO_ERROR = 0;
    LOOKUP_ERROR = 1;
    CONNECTIVITY_ERROR = 2;
    EXTRAPOLATION_ERROR = 3;
    INVALID_ARGUMENT_ERROR = 4;
    TIMEOUT_ERROR = 5;
    TRANSFORM_ERROR = 6;
  }

  // Machine-readable lookup outcome; NO_ERROR indicates success.
  Code error = 1;

  // Human-readable failure detail, empty when error is NO_ERROR.
  string error_string = 2;
}
