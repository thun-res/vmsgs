syntax = "proto3";

package vmsgs.proto.sensor;

import "common/header.proto";
import "common/uuid.proto";
import "geometry/vector3.proto";

// Lightweight radar track: position/velocity/acceleration without covariance.
// Use RadarObject (radar_object.proto) when full uncertainty, amplitude, and
// radar field metadata are required.
message RadarTrack {
  vmsgs.proto.common.UUID uuid = 1;               // Stable 128-bit tracker identity.
  vmsgs.proto.geometry.Vector3 position = 2;      // Target position in metres.
  vmsgs.proto.geometry.Vector3 velocity = 3;      // Target velocity in metres per second.
  vmsgs.proto.geometry.Vector3 acceleration = 4;  // Target acceleration in m/s^2.
  // Bounding-box extents in m.
  vmsgs.proto.geometry.Vector3 size = 5;
  // Class id; see perception.ObjectLabel.
  uint32 classification = 6;
  // Radar cross section (dBsm).
  float rcs_dbsm = 7;
  // [0, 1] confidence.
  float existence_probability = 8;
}

// Radar tracks updated together in one timestamped scan or fusion cycle.
message RadarTracks {
  vmsgs.proto.common.Header header = 1;  // Observation time and common track frame.
  // Tracks observed in this cycle; each track's uuid provides stable identity.
  repeated RadarTrack tracks = 2;
}
