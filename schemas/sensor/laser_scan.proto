syntax = "proto3";

package vmsgs.proto.sensor;

import "common/header.proto";
import "common/duration.proto";

// Single planar laser sweep (2D LiDAR).
message LaserScan {
  // Acquisition timestamp in nanoseconds and scan coordinate frame.
  vmsgs.proto.common.Header header = 1;
  float angle_min = 2;        // rad
  float angle_max = 3;        // rad
  float angle_increment = 4;  // rad between consecutive readings
  vmsgs.proto.common.Duration time_increment = 5;  // interval between consecutive readings
  vmsgs.proto.common.Duration scan_time = 6;       // duration of a full sweep
  float range_min = 7;        // m
  float range_max = 8;        // m
  // Beam ranges in metres, ordered from angle_min by angle_increment.
  repeated float ranges = 9 [packed = true];
  // Per-beam intensity, optional (length 0 or N).
  repeated float intensities = 10 [packed = true];
}
