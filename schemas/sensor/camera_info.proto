syntax = "proto3";

package vmsgs.proto.sensor;

import "common/header.proto";
import "sensor/region_of_interest.proto";

// Pinhole + distortion model parameters.
message CameraInfo {
  // Lens-distortion model defining the coefficient array interpretation.
  enum DistortionModel {
    DISTORTION_MODEL_UNKNOWN = 0;
    DISTORTION_MODEL_NONE = 1;
    DISTORTION_MODEL_PLUMB_BOB = 2;
    DISTORTION_MODEL_RATIONAL_POLYNOMIAL = 3;
    // Equidistant fisheye model, also known as Kannala-Brandt.
    DISTORTION_MODEL_EQUIDISTANT = 4;
    DISTORTION_MODEL_OMNIDIRECTIONAL = 5;
  }

  // Calibration timestamp in nanoseconds and optical coordinate frame.
  vmsgs.proto.common.Header header = 1;
  // Calibrated image height in pixels.
  uint32 height = 2;
  // Calibrated image width in pixels.
  uint32 width = 3;
  // Lens model controlling the order and meaning of coefficients in d.
  DistortionModel distortion_model = 4;
  // Length-N distortion coefficients (varies per model).
  repeated double d = 5 [packed = true];
  // 3x3 row-major intrinsic matrix.
  repeated double k = 6 [packed = true];
  // 3x3 row-major rectification matrix (stereo).
  repeated double r = 7 [packed = true];
  // 3x4 row-major projection matrix.
  repeated double p = 8 [packed = true];
  // Horizontal sensor binning factor; zero or one means no binning.
  uint32 binning_x = 9;
  // Vertical sensor binning factor; zero or one means no binning.
  uint32 binning_y = 10;
  // Valid image rectangle measured from the upper-left pixel origin.
  vmsgs.proto.sensor.RegionOfInterest roi = 11;
}
