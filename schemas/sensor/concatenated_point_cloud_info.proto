syntax = "proto3";

package vmsgs.proto.sensor;

import "common/header.proto";

// Side-channel metadata describing the contributors to a fused point cloud
// emitted by a multi-LiDAR concatenation node.
// Provenance and time interval of one source used in point-cloud concatenation.
message SourcePointCloudInfo {
  string topic = 1;     // Canonical URL of the source point-cloud stream.
  string frame_id = 2;  // Coordinate frame of the source cloud before fusion.
  uint64 time_meas = 3;  // nanoseconds
  // Number of points contributed.
  uint32 num_points = 4;
}

// Summary of all sources contributing to one concatenated point cloud.
message ConcatenatedPointCloudInfo {
  vmsgs.proto.common.Header header = 1;  // Fusion time in nanoseconds and output frame.
  uint32 total_num_points = 2;           // Point count in the corresponding fused payload.
  // Source clouds in concatenation order; point counts partition the output.
  repeated SourcePointCloudInfo sources = 3;
  // True when at least one expected source was missing at concatenation time.
  bool has_missing_source = 4;
}
