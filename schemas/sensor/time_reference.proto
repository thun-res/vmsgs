syntax = "proto3";

package vmsgs.proto.sensor;

import "common/header.proto";

// Reports the time according to a non-Linux
// clock source (PTP master, GNSS, NTP server). `header.stamp` is the system
// time at which the reference was sampled.
message TimeReference {
  vmsgs.proto.common.Header header = 1;  // Local acquisition time and source frame.
  uint64 time_ref = 2;                   // nanoseconds
  string source = 3;                     // External clock name, such as GNSS or PTP grandmaster.
}
