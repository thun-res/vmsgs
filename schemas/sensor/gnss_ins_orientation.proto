syntax = "proto3";

package vmsgs.proto.sensor;

import "common/header.proto";
import "geometry/quaternion.proto";

// Orientation reported by a GNSS-aided INS (e.g. heading + pitch from a dual-antenna
// receiver). RMS values are 1-sigma in radians.
message GnssInsOrientation {
  vmsgs.proto.common.Header header = 1;             // Measurement time and navigation frame.
  vmsgs.proto.geometry.Quaternion orientation = 2;  // Unit body orientation quaternion.
  float rmse_rotation_x = 3;                        // Roll-axis root-mean-square error, in radians.
  float rmse_rotation_y = 4;                        // Pitch-axis root-mean-square error, in radians.
  float rmse_rotation_z = 5;                        // Yaw-axis root-mean-square error, in radians.
}
